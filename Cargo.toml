[package]
name = "forge-graph"
version = "0.1.0"
edition = "2024"
description = "Graph: a local and a global graph of how your notes link, in the manner of Obsidian"
license = "GPL-3.0-or-later"

[package.metadata.forge]
name = "graph"

# Standalone: not part of the main workspace build.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
forge-plugin-sdk = { git = "https://github.com/martial-plains/forge" }
forge-notes = { git = "https://github.com/martial-plains/forge" }
forge-canvas = { git = "https://github.com/martial-plains/forge", default-features = false }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
